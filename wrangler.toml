name = "document-control-center"
main = "worker/index.ts"
compatibility_date = "2025-01-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Optional: Bind your Cloudflare D1 database directly by uncommenting below and setting your real database_id,
# OR attach a D1 binding named "DB" in Cloudflare Dashboard (Workers & Pages -> Settings -> Bindings),
# OR set CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_D1_DATABASE_ID, and CLOUDFLARE_API_TOKEN as Worker Secrets.
#
# [[d1_databases]]
# binding = "DB"
# database_name = "dcc-database"
# database_id = "<YOUR_D1_DATABASE_ID>"
# migrations_dir = "d1"
