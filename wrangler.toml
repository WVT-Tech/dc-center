name = "dc-center"
main = "worker/index.ts"
compatibility_date = "2025-01-01"
keep_vars = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# IMPORTANT: Bindings added only in the Cloudflare Dashboard are removed on the next GitHub/Wrangler deploy
# unless [[d1_databases]] is declared below with your real database_id.
# Uncomment the 4 lines below and replace <YOUR_D1_DATABASE_ID> with your dcc-database UUID from Cloudflare Dashboard -> D1:
#
[[d1_databases]]
binding = "DB"
database_name = "dcc-database"
database_id = "41328f22-d402-4500-95c2-6139fca73753"
